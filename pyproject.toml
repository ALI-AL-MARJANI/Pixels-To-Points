[project]
name = "pixels-to-points"
version = "0.1.0"
description = "How few points and bits does a page need? Compressing ColPali-style visual document retrieval."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "datasets>=3.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
encode = ["colpali-engine==0.3.18"]
dev = ["pytest>=8.0", "fastembed>=0.7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
